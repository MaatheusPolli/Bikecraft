name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validar:
    name: Validar HTML, CSS e PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: HTML (html-validate)
        run: npm run lint:html

      - name: CSS (stylelint)
        run: npm run lint:css

      - name: PHP (sintaxe)
        run: |
          for f in *.php; do php -l "$f"; done

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: validar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lighthouse CI nas páginas estáticas
        run: npx -y @lhci/cli@0.14.0 autorun --config=lighthouserc.json
